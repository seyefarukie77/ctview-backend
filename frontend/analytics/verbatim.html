{% extends "base.html" %}
{% block title %}Theme × Sentiment Matrix{% endblock %}

{<h1>Verbatim Explorer</h1>

<form id="verbatim-search-form" class="mb-3">
  <div class="row g-2">
    <div class="col-md-4">
      <input type="text" id="query" class="form-control" placeholder="Search text…">
    </div>
    <div class="col-md-3">
      <input type="text" id="theme" class="form-control" placeholder="Theme…">
    </div>
    <div class="col-md-3">
      <input type="text" id="sentiment" class="form-control" placeholder="Sentiment…">
    </div>
    <div class="col-md-2">
      <button class="btn btn-primary w-100">Search</button>
    </div>
  </div>
</form>

<table class="table table-striped table-hover">
  <thead class="table-dark">
    <tr>
      <th>Date</th>
      <th>Text</th>
      <th>Theme</th>
      <th>Sentiment</th>
    </tr>
  </thead>
  <tbody id="verbatim-table-body"></tbody>
</table>
}
<h1>Theme × Sentiment Matrix</h1>

<div id="theme-sentiment-plot"></div>
{% endblock %}

{<script>
async function loadVerbatim(filters = {}) {
  const params = new URLSearchParams(filters);
  const res = await fetch('/api/analytics/verbatim?' + params.toString());
  const data = await res.json();

  const tbody = document.getElementById('verbatim-table-body');
  tbody.innerHTML = '';

  data.forEach(item => {
    const row = `
      <tr>
        <td>${item.date}</td>
        <td>${item.text}</td>
        <td>${item.theme ?? '—'}</td>
        <td>${item.sentiment ?? '—'}</td>
      </tr>
    `;
    tbody.insertAdjacentHTML('beforeend', row);
  });
}

document.addEventListener('DOMContentLoaded', () => {
  loadVerbatim();

  document.getElementById('verbatim-search-form')
    .addEventListener('submit', e => {
      e.preventDefault();
      loadVerbatim({
        query: document.getElementById('query').value,
        theme: document.getElementById('theme').value,
        sentiment: document.getElementById('sentiment').value
      });
    });
});
</script>
}
<script>
async function loadThemeSentiment() {
  const res = await fetch('/api/analytics/theme-sentiment');
  const data = await res.json();

  console.log(data);
  // TODO: build heatmap or grouped bar chart here
}

document.addEventListener('DOMContentLoaded', loadThemeSentiment);
</script>
{% endblock %}
